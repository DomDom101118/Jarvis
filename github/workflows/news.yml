name: News aktualisieren
on:
  schedule:
    - cron: '7 * * * *'   # jede Stunde, Minute 7
  workflow_dispatch:       # manuell startbar
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: News holen
        run: python scripts/fetch_news.py
      - name: Änderungen speichern
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "News aktualisiert"
            git push
          fi

